<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-lgpd.css">
    <link rel="stylesheet" href="fonts/fonts.css">
</head>

<body>
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon">🌙</span>
    </button>

    <div class="container">
        <h1>[ COUNTDOWN ]</h1>
        <div id="countdown">
            <div class="countdown-item">
                <span id="months"></span>Mês
            </div>
            <div class="countdown-item">
                <span id="days"></span>Dia
            </div>
            <div class="countdown-item">
                <span id="hours"></span>Hora
            </div>
            <div class="countdown-item">
                <span id="minutes"></span>Min
            </div>
            <div class="countdown-item seconds">
                <span id="seconds"></span>Seg
            </div>
        </div>
    </div>

    <!-- LGPD Consent Banner -->
    <div id="lgpd-banner" class="lgpd-banner" role="dialog" aria-label="Aviso de Privacidade">
        <div class="lgpd-banner-content">
            <div class="lgpd-banner-icon">🔒</div>
            <div class="lgpd-banner-text">
                <p>Este site armazena sua preferência de tema (claro/escuro) no navegador para melhorar sua experiência. <strong>Não coletamos dados pessoais, não usamos cookies de rastreamento.</strong></p>
                <p>Você pode escolher se permite ou não o armazenamento local.</p>
            </div>
            <div class="lgpd-banner-actions">
                <button id="lgpd-accept" class="lgpd-btn lgpd-btn-primary">Aceitar</button>
                <button id="lgpd-reject" class="lgpd-btn lgpd-btn-secondary">Recusar</button>
                <a href="privacidade.html" class="lgpd-link">Política de Privacidade</a>
            </div>
        </div>
    </div>

    <!-- Application - Standalone Version -->
    <script src="app-standalone.js"></script>
</body>

</html>
