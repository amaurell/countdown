<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fonts/fonts.css">
</head>

<body>
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon">🌙</span>
    </button>

    <div class="container">
        <h1>[ COUNTDOWN ]</h1>
        <div id="countdown">
            <div class="countdown-item">
                <span id="months"></span>Mês
            </div>
            <div class="countdown-item">
                <span id="days"></span>Dia
            </div>
            <div class="countdown-item">
                <span id="hours"></span>Hora
            </div>
            <div class="countdown-item">
                <span id="minutes"></span>Min
            </div>
            <div class="countdown-item seconds">
                <span id="seconds"></span>Seg
            </div>
        </div>
    </div>

    <!-- Application - Standalone Version (funciona sem servidor HTTP) -->
    <script src="app-standalone.js"></script>
    <div class="lgpd-footer" style="text-align:center;padding:20px;font-size:12px;color:#888;border-top:1px solid #333;margin-top:40px">
        <a href="privacidade.html" style="color:#888;text-decoration:none">Política de Privacidade</a>
    </div>
</body>

</html>
